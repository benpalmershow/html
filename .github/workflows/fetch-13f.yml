name: Fetch 13F Holdings

on:
  schedule:
    # 13F filings: 45 days after quarter end (mid-Feb, mid-May, mid-Aug, mid-Nov)
    # Aggressive 10th-25th of filing months at 8-16 UTC; weekly otherwise
    - cron: '*/30 8-16 10-25 2,5,8,11 *'
    - cron: '30 8 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: fetch-13f
  cancel-in-progress: false

jobs:
  fetch-13f:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch 13F filings from SEC EDGAR
        run: |
          python3 scripts/fetch_13f.py

      - name: Validate JSON output
        run: |
          python3 -m json.tool json/13f-holdings.json > /dev/null
          python3 -m json.tool json/13f-ticker-map.json > /dev/null

      - name: Record fetch status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) STATUS=ok ;;
            failure|cancelled) STATUS=failed ;;
            skipped) STATUS=skipped ;;
          esac
          python3 scripts/update_fetch_status.py --workflow fetch-13f --status "$STATUS" --notes "13F holdings from SEC EDGAR" || true

      - name: Commit and push changes
        uses: ./.github/actions/commit-changes
        with:
          message: "chore: refresh 13F holdings from SEC EDGAR [skip ci]"
          files: json/13f-holdings.json json/13f-ticker-map.json

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs
          path: logs/
          retention-days: 7
