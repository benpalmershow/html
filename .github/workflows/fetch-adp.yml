name: Fetch ADP Private Employment

on:
  schedule:
    # ADP Private Employment: 1st Wednesday of month at 8:15 AM ET (12:15/13:15 UTC)
    # Aggressive Wed 11-16 UTC on 1st-7th; daily otherwise
    - cron: '*/15 11-16 1-7 * 3'
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-adp
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install requests tenacity
      - run: python3 scripts/fetch_adp.py
      - run: npm run validate
      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add json/financials-data.json
          if git diff --cached --quiet; then
            echo "No ADP data changes to commit"
            exit 0
          fi
          git commit -m "chore: update ADP private employment [skip ci]"
          bash scripts/git_push_retry.sh "$(git branch --show-current)"