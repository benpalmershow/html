name: Fetch ADP Private Employment

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests tenacity
      - run: python3 scripts/fetch_adp.py
      - run: npm run validate
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add json/financials-data.json
          git diff --cached --quiet || git commit -m "Update ADP private employment [skip ci]"
          git push
EOF