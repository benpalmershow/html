name: Fetch ADP Private Employment

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install requests tenacity
      - run: python3 scripts/fetch_adp.py
      - run: npm run validate
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add json/financials-data.json
          if git diff --cached --quiet; then
            echo "No ADP data changes to commit"
            exit 0
          fi
          git commit -m "chore: update ADP private employment [skip ci]"
          bash scripts/git_push_retry.sh "$(git branch --show-current)"