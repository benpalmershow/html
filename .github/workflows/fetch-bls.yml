name: Fetch BLS Data

on:
  schedule:
    # BLS releases: Jobs (1st Fri 8:30 ET), CPI/PPI (mid-month ~13th 8:30 ET), JOLTS (early month ~4th 10:00 ET)
    # Aggressive: 1st-3rd (JOLTS), 1st Fri (Jobs), 10th-15th (CPI/PPI) at 12-18 UTC; daily 6:30 otherwise
    - cron: '*/15 12-18 1-3 * *'
    - cron: '*/15 12-18 1-7 * 5'
    - cron: '*/15 12-18 10-15 * *'
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-bls
  cancel-in-progress: false

jobs:
  fetch-bls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch BLS indicators
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          if [ -z "$BLS_API_KEY" ]; then
            echo "BLS_API_KEY secret is not set"
            exit 1
          fi
          # PPI is intentionally NOT fetched here: it is sourced from the FRED
          # series PPIFIS (seasonally adjusted Final Demand Producer Price
          # Index) at https://fred.stlouisfed.org/series/PPIFIS by the
          # fetch-fred workflow, so the BLS workflow must not overwrite it.
          python3 scripts/fetch_bls.py

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No BLS data changes to commit"
            exit 0
          fi
          git commit -m "chore: update BLS economic indicators [skip ci]"
          bash scripts/git_push_retry.sh "$(git branch --show-current)"
