name: Fetch BLS Data

on:
  schedule:
    # Run daily at 6:30 AM UTC
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-bls
  cancel-in-progress: false

jobs:
  fetch-bls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch BLS indicators
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          if [ -z "$BLS_API_KEY" ]; then
            echo "BLS_API_KEY secret is not set"
            exit 1
          fi
          # PPI is intentionally NOT fetched here: it is sourced from the FRED
          # series PPIFIS (seasonally adjusted Final Demand Producer Price
          # Index) at https://fred.stlouisfed.org/series/PPIFIS by the
          # fetch-fred workflow, so the BLS workflow must not overwrite it.
          python3 scripts/fetch_bls.py

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No BLS data changes to commit"
            exit 0
          fi
          git commit -m "chore: update BLS economic indicators [skip ci]"
          git push
