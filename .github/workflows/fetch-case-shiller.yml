name: Fetch Case-Shiller Index

on:
  schedule:
    # S&P Case-Shiller: last Tuesday of month at 9:00 AM ET (13:00/14:00 UTC)
    # Aggressive last Tue 12-18 UTC (days 22-28, Tue); daily otherwise
    - cron: '*/15 12-18 22-28 * 2'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-case-shiller
  cancel-in-progress: false

jobs:
  fetch-case-shiller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Case-Shiller index
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY secret is not set"
            exit 1
          fi
          python3 scripts/fetch_fred.py --indicators "Case-Shiller National Home Price Index"

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No Case-Shiller data changes to commit"
            exit 0
          fi
          git commit -m "chore: update Case-Shiller National Home Price Index [skip ci]"
          bash scripts/git_push_retry.sh "$(git branch --show-current)"
