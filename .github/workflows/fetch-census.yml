name: Fetch Census Data

on:
  schedule:
    # Run monthly on the 15th at 10:00 UTC, after the FT-900 release
    # (roughly six weeks after month-end); skips days when the source
    # has published no revision or new data.
    - cron: '0 10 15 * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: fetch-census
  cancel-in-progress: false

jobs:
  fetch-census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The Census API requires a free key:
      # https://api.census.gov/data/key_signup.html
      - name: Fetch Census indicators
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          if [ -z "$CENSUS_API_KEY" ]; then
            echo "CENSUS_API_KEY secret is not set"
            exit 1
          fi
          python3 scripts/fetch_census.py --indicators "trade-deficit,new-orders,construction-spending"

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No Census data changes to commit"
            exit 0
          fi
          git commit -m "chore: update Census trade indicators [skip ci]"
          git push
