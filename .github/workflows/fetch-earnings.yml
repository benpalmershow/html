name: Fetch Earnings

on:
  schedule:
    # Generated from actual per-stock nextEarningsDate in json/earnings.json by
    # scripts/gen-earnings-cron.py. Polls every 5 min (GitHub cron minimum, so
    # "immediate" is ~5 min) only on dates a tracked stock actually reports,
    # covering pre-market (~4-10 ET = 08-14 UTC) and after-close (~16-20 ET =
    # 20-23 UTC same day + 00-05 UTC next day). Re-run the script and paste the
    # output here whenever nextEarningsDate rolls forward after a report.
    # 2026-12-01
    - cron: '*/5 8-14,20-23 1 12 *'
    - cron: '*/5 0-5 2 12 *'
    # 2027-01-13
    - cron: '*/5 8-14,20-23 13 1 *'
    - cron: '*/5 0-5 14 1 *'
    # 2027-01-27
    - cron: '*/5 8-14,20-23 27 1 *'
    - cron: '*/5 0-5 28 1 *'
    # 2027-02-03
    - cron: '*/5 8-14,20-23 3 2 *'
    - cron: '*/5 0-5 4 2 *'
    # 2027-02-09
    - cron: '*/5 8-14,20-23 9 2 *'
    - cron: '*/5 0-5 10 2 *'
    # 2027-02-24
    - cron: '*/5 8-14,20-23 24 2 *'
    - cron: '*/5 0-5 25 2 *'
    # 2027-02-25
    - cron: '*/5 8-14,20-23 25 2 *'
    - cron: '*/5 0-5 26 2 *'
    # 2027-03-02
    - cron: '*/5 8-14,20-23 2 3 *'
    - cron: '*/5 0-5 3 3 *'
    # 2027-03-31
    - cron: '*/5 8-14,20-23 31 3 *'
    - cron: '*/5 0-5 1 4 *'
    # Weekly fallback when no tracked stock reports
    - cron: '0 6 * * 1'
  workflow_dispatch:          # Manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: fetch-earnings
  cancel-in-progress: false

jobs:
  fetch-earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install yfinance pandas lxml requests

      - name: Verify cron schedule matches earnings calendar
        run: |
          python3 scripts/gen-earnings-cron.py | grep -E '^[[:space:]]*- cron:' > /tmp/expected-cron.txt
          grep -E '^[[:space:]]*- cron:' .github/workflows/fetch-earnings.yml > /tmp/actual-cron.txt
          if ! diff -u /tmp/actual-cron.txt /tmp/expected-cron.txt; then
            echo "::warning::nextEarningsDate has rolled forward. Regenerate the schedule block:"
            echo "::warning::  python3 scripts/gen-earnings-cron.py"
          fi

      - name: Preserve ANT manual entry
        run: |
          python3 -c "
          import json
          with open('json/earnings.json', 'r') as f:
              data = json.load(f)
          ant_entry = next((e for e in data.get('earnings', []) if e.get('ticker') == 'ANT'), None)
          if ant_entry and ant_entry.get('source') == 'SEC EDGAR':
              with open('/tmp/ant_backup.json', 'w') as f:
                  json.dump(ant_entry, f)
              echo 'ANT entry backed up'
          else:
              echo 'No ANT manual entry to backup'
          "

      - name: Run earnings fetcher
        run: python3 scripts/fetch_earnings.py

      - name: Restore ANT manual entry
        run: |
          if [ -f /tmp/ant_backup.json ]; then
            python3 -c "
            import json
            with open('/tmp/ant_backup.json', 'r') as f:
                ant_entry = json.load(f)
            with open('json/earnings.json', 'r') as f:
                data = json.load(f)
            # Remove any ANT entry from fetcher
            data['earnings'] = [e for e in data['earnings'] if e.get('ticker') != 'ANT']
            # Re-insert manual ANT entry
            data['earnings'].append(ant_entry)
            with open('json/earnings.json', 'w') as f:
                json.dump(data, f, indent=2, ensure_ascii=False)
            echo 'ANT entry restored'
            "
          else
            echo 'No ANT backup to restore'
          fi

      - name: Ensure ANT in tickers list
        run: |
          python3 - <<'PY'
          import json
          with open('json/earnings-tickers.json', 'r') as f:
              data = json.load(f)
          if 'ANT' not in data.get('tickers', []):
              data['tickers'].append('ANT')
              data['lastEdited'] = '2026-11-07'
              with open('json/earnings-tickers.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print('ANT added to tickers list')
          else:
              print('ANT already in tickers list')
          PY

      - name: Run SEC quarterly fetcher
        run: python3 scripts/fetch_sec_quarterly.py

      - name: Validate JSON
        run: |
          python3 -m json.tool json/earnings.json > /dev/null
          python3 -m json.tool json/earnings-tickers.json > /dev/null

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/earnings.json json/earnings-tickers.json
          if git diff --staged --quiet; then
            echo "No earnings changes detected"
            exit 0
          fi
          git commit -m "chore: update earnings [skip ci]"
          bash scripts/git_push_retry.sh "$(git branch --show-current)"
