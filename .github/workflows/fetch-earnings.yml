name: Fetch Earnings

on:
  schedule:
    # Earnings seasons: Jan, Apr, Jul, Oct. Poll every 5 min (GitHub cron
    # minimum) during release windows on weekdays; weekly otherwise. The fetch
    # is idempotent and no-ops when nothing changed, so extra runs are cheap.
    - cron: '*/5 8-14,20-23 * 1,4,7,10 1-5'
    - cron: '*/5 0-5 * 1,4,7,10 2-6'
    - cron: '0 6 * * 1'
  workflow_dispatch:          # Manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: fetch-earnings
  cancel-in-progress: false

jobs:
  fetch-earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run earnings fetcher
        run: python3 scripts/fetch_earnings.py

      - name: Run SEC quarterly fetcher
        run: python3 scripts/fetch_sec_quarterly.py

      - name: Validate JSON
        run: |
          python3 -m json.tool json/earnings.json > /dev/null
          python3 -m json.tool json/earnings-tickers.json > /dev/null

      - name: Record fetch status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) STATUS=ok ;;
            failure|cancelled) STATUS=failed ;;
            skipped) STATUS=skipped ;;
          esac
          python3 scripts/update_fetch_status.py --workflow fetch-earnings --status "$STATUS" --notes "Earnings + SEC quarterly" || true

      - name: Commit and push
        uses: ./.github/actions/commit-changes
        with:
          message: "chore: update earnings [skip ci]"
          files: json/earnings.json json/earnings-tickers.json
