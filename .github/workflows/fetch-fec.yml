name: Fetch Elections

on:
  schedule:
    # FEC filings continuous; quarterly deadlines (Jan/Apr/Jul/Oct 15, 30)
    # Aggressive 1st-15th & 15th-30th of quarter months at 8-16 UTC; daily otherwise
    - cron: '*/30 8-16 1-15,16-30 1,4,7,10 *'
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: fetch-fec
  cancel-in-progress: false

jobs:
  fetch-fec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch FEC candidate totals
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          if [ -z "$FEC_API_KEY" ]; then
            echo "FEC_API_KEY secret is not set"
            exit 1
          fi
          python3 scripts/fetch_fec.py

      - name: Validate JSON output
        run: python3 -m json.tool json/fec-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/fec-data.json
          if git diff --staged --quiet; then
            echo "No FEC data changes to commit"
            exit 0
          fi
          git commit -m "chore: update FEC campaign finance data [skip ci]"
          bash scripts/git_push_retry.sh "$(git branch --show-current)"
