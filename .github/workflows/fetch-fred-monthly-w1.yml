name: "Fetch FRED Monthly Indicators (Release Window: Days 1-7)"

on:
  schedule:
    # Unemployment Rate / Jobs / Average Hourly Earnings (first Friday, days 1-7).
    # PCE/GDP timing varies; catch-up cron covers delayed releases/revisions.
    # Every 5 minutes during days 1-7 for fast pickup on release day.
    - cron: '*/5 12-18 * 1-7 *'
    # Daily catch-up to pick up delayed releases, revisions, or missed runs.
    - cron: '15 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-fred-monthly-w1
  cancel-in-progress: false

jobs:
  fetch-fred-monthly-w1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch FRED monthly indicators (days 1-7)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY secret is not set"
            exit 1
          fi
          python3 scripts/fetch_fred.py --indicators "Unemployment Rate,Jobs,Average Hourly Earnings,GDP"

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No FRED W1 data changes to commit"
            exit 0
          fi
          git commit -m "chore: update FRED monthly indicators [skip ci]"
          git push
