name: "Fetch FRED Monthly Indicators (Release Window: Days 8-19)"

on:
  schedule:
    # CPI/PPI (days 10-15), Monthly Retail Sales (days 12-16),
    # Housing Starts / Building Permits (days 15-19), Industrial Production /
    # Capacity Utilization (days 14-18), Small Business Optimism, Affordability Index.
    # Every 5 minutes only during days 8-19; idle rest of month.
    - cron: '*/5 * * 8-19 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-fred-monthly-w2
  cancel-in-progress: false

jobs:
  fetch-fred-monthly-w2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch FRED monthly indicators (days 8-19)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY secret is not set"
            exit 1
          fi
          python3 scripts/fetch_fred.py --indicators "CPI,PPI,Monthly Retail Sales,Housing Starts,Building Permits,Industrial Production Index,Capacity Utilization,Small Business Optimism Index,Affordability Index"

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No FRED W2 data changes to commit"
            exit 0
          fi
          git commit -m "chore: update FRED monthly indicators [skip ci]"
          git push
