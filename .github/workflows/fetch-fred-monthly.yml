name: Fetch FRED Monthly Indicators

on:
  schedule:
    # Run monthly on the 1st at 7:00 UTC, after FRED's monthly releases
    # (CPI, PPI, employment, retail sales, etc.);
    # only commits when a source revision or new month exists.
    - cron: '0 7 1 * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: fetch-fred-monthly
  cancel-in-progress: false

jobs:
  fetch-fred-monthly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch FRED monthly indicators
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY secret is not set"
            exit 1
          fi
          python3 scripts/fetch_fred.py --indicators "CPI,PPI,Unemployment Rate,Jobs,Average Hourly Earnings,Monthly Retail Sales,Industrial Production Index,Capacity Utilization,Consumer Confidence,Small Business Optimism Index,Housing Starts,New Home Sales,Building Permits,Case-Shiller National Home Price Index,Affordability Index,Personal Consumption Expenditures (PCE),Consumer Sentiment"

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No FRED monthly data changes to commit"
            exit 0
          fi
          git commit -m "chore: update FRED monthly indicators [skip ci]"
          git push
