name: Fetch FRED Weekly Indicators

on:
  schedule:
    # Run weekly on Mondays at 6:00 UTC for FRED weekly-frequency series;
    # only commits when a source revision or new observation exists.
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: fetch-fred-weekly
  cancel-in-progress: false

jobs:
  fetch-fred-weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch FRED weekly indicators
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY secret is not set"
            exit 1
          fi
          python3 scripts/fetch_fred.py --indicators "Jobless Claims,30-yr Mortgage Rate,U.S. Petroleum Exports"

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No FRED weekly data changes to commit"
            exit 0
          fi
          git commit -m "chore: update FRED weekly indicators [skip ci]"
          git push
