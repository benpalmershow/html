name: Fetch FRED Weekly Indicators

on:
  schedule:
    # FRED weekly series: Jobless Claims (Thu 8:30 ET), Mortgage Rate (Thu 12:00 ET), Petroleum (Wed/Thu)
    # Aggressive Thu-Fri 12-20 UTC (covers 8:30 ET Thu + releases through Fri); daily otherwise
    - cron: '*/15 12-20 * * 4,5'
    - cron: '0 6 * * 0-3,6'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: fetch-fred-weekly
  cancel-in-progress: false

jobs:
  fetch-fred-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch FRED weekly indicators
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY secret is not set"
            exit 1
          fi
          python3 scripts/fetch_fred.py --indicators "Jobless Claims,30-yr Mortgage Rate,U.S. Petroleum Exports"

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No FRED weekly data changes to commit"
            exit 0
          fi
          git commit -m "chore: update FRED weekly indicators [skip ci]"
          bash scripts/git_push_retry.sh "$(git branch --show-current)"
