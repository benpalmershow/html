name: Fetch Manheim Used Vehicle Value Index

on:
  schedule:
    # MUVVI is released on the 5th business day of each month (~11 AM ET).
    # Aggressive polling in the release window (5th-9th), daily otherwise.
    - cron: '*/30 14-17 5-9 * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-manheim
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install requests tenacity
      - run: python3 scripts/fetch_manheim.py
      - run: npm run validate
      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add json/financials-data.json
          if git diff --cached --quiet; then
            echo "No Manheim data changes to commit"
            exit 0
          fi
          git commit -m "chore: update Manheim used vehicle value index [skip ci]"
          bash scripts/git_push_retry.sh "$(git branch --show-current)"