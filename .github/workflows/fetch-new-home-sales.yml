name: Fetch New Home Sales

on:
  schedule:
    # New Residential Sales releases on the 27th of each month at 10:00 am ET.
    - cron: '0 14 27 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-new-home-sales
  cancel-in-progress: false

jobs:
  fetch-new-home-sales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch New Home Sales
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY secret is not set"
            exit 1
          fi
          python3 scripts/fetch_fred.py --indicators "New Home Sales"

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No New Home Sales data changes to commit"
            exit 0
          fi
          git commit -m "chore: update New Home Sales [skip ci]"
          git push
