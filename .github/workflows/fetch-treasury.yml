name: Fetch Treasury Data

on:
  schedule:
    # Run daily at 9:00 AM UTC (debt-to-the-penny is daily; MTS lands mid-month)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: fetch-treasury
  cancel-in-progress: false

jobs:
  fetch-treasury:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The Treasury Fiscal Data API is open (no key required):
      # https://api.fiscaldata.treasury.gov/services/api/fiscal_service
      - name: Fetch Treasury indicators
        run: python3 scripts/fetch_treasury.py

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No Treasury data changes to commit"
            exit 0
          fi
          git commit -m "chore: update Treasury fiscal indicators [skip ci]"
          git push
