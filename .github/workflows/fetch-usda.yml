name: Fetch USDA NASS Data

on:
  schedule:
    # USDA NASS prices: monthly around 5th
    # Aggressive 1st-10th at 6-12 UTC; weekly otherwise
    - cron: '*/30 6-12 1-10 * *'
    - cron: '0 7 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: fetch-usda
  cancel-in-progress: false

jobs:
  fetch-usda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch USDA NASS price data
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          python3 scripts/fetch_usda.py

      - name: Validate JSON output
        run: python3 -m json.tool json/financials-data.json > /dev/null

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/financials-data.json
          if git diff --staged --quiet; then
            echo "No USDA data changes to commit"
            exit 0
          fi
          git commit -m "chore: update USDA NASS commodity prices [skip ci]"
          bash scripts/git_push_retry.sh "$(git branch --show-current)"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs
          path: logs/
          retention-days: 7
