name: Fetch World Cup Scores

on:
  schedule:
    # Run every 10 minutes during tournament
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: fetch-world-cup
  cancel-in-progress: false

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check tournament date range
        id: date-check
        run: |
          MONTH=$(date +%-m)
          if [ "$MONTH" -lt 6 ] || [ "$MONTH" -gt 7 ]; then
            echo "Outside tournament window (June-July). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.date-check.outputs.skip == 'false'
        uses: actions/checkout@v5

      - name: Set up Python
        if: steps.date-check.outputs.skip == 'false'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.date-check.outputs.skip == 'false'
        run: |
          pip install -r requirements.txt

      - name: Fetch World Cup scores
        if: steps.date-check.outputs.skip == 'false'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "$FOOTBALL_DATA_API_KEY" ]; then
            echo "FOOTBALL_DATA_API_KEY secret is not set"
            exit 1
          fi
          python3 scripts/fetch_world_cup.py

      - name: Validate World Cup data
        if: steps.date-check.outputs.skip == 'false'
        run: |
          python3 -m json.tool json/world-cup.json > /dev/null

      - name: Record fetch status
        if: always()
        run: |
          if [ "${{ steps.date-check.outputs.skip }}" = "true" ]; then
            st=skipped
          elif [ "${{ job.status }}" = "success" ]; then
            st=ok
          else
            st=failed
          fi
          python3 scripts/update_fetch_status.py --workflow fetch-world-cup --status "$st" --notes "World Cup scores" || true

      - name: Commit and push changes
        if: steps.date-check.outputs.skip == 'false'
        uses: ./.github/actions/commit-changes
        with:
          message: "chore: update World Cup scores [skip ci]"
          files: json/world-cup.json

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs
          path: logs/
          retention-days: 7
