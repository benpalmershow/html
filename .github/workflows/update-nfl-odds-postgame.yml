name: Update NFL Odds (Post-Game Cleanup)

on:
  schedule:
    # Post Thursday night games (Friday ~3:30-5:30 UTC, games end ~3:15 UTC)
    - cron: '30 3-5 * * 5'
    # Post Sunday games (Monday ~0:30-2:30 UTC for 1pm/4pm games, ~3:30-5:30 for 8pm)
    - cron: '30 0-2 * * 1'
    - cron: '30 3-5 * * 1'
    # Post Monday night games (Tuesday ~3:30-5:30 UTC)
    - cron: '30 3-5 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nfl-odds-postgame
  cancel-in-progress: true

jobs:
  postgame-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply NFL YAML with completed game removal
        run: python3 scripts/apply-nfl-yml.py --replace-completed

      - name: Validate final site state
        run: node scripts/validate-site.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl-games.yml json/financials-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: nfl post-game cleanup [skip ci]"
            bash scripts/git_push_retry.sh "$(git branch --show-current)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}