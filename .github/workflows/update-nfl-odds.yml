name: Update NFL Odds

on:
  schedule:
    - cron: '0 6 * * *' # Run daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nfl-odds
  cancel-in-progress: true

jobs:
  update-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine current NFL week (from game dates in YAML)
        id: week
        run: |
          # NFL season weeks (1-18) are NOT the ISO calendar week number.
          # Derive the active NFL week from data/nfl-games.yml instead:
          # the week containing today, or the nearest upcoming week if today
          # falls between weeks. Games from all active weeks are refreshed.
          WEEK=$(python3 - <<'PY'
          import datetime, sys
          from pathlib import Path
          try:
              import yaml
          except ImportError:
              print(); sys.exit(0)
          doc = yaml.safe_load(Path("data/nfl-games.yml").read_text()) or {}
          now = datetime.datetime.now(datetime.timezone.utc)
          weeks = []
          for g in doc.get("games", []):
              w = g.get("week")
              iso = g.get("game_time_iso")
              if w is None or not iso:
                  continue
              try:
                  dt = datetime.datetime.fromisoformat(iso.replace("Z", "+00:00"))
              except ValueError:
                  continue
              weeks.append((w, dt))
          if not weeks:
              print(); sys.exit(0)
          # Active weeks: those whose game window covers today, or the next
          # upcoming week if today is before the next game window.
          upcoming = [w for w, dt in weeks if dt >= now]
          if upcoming:
              print(max(upcoming))
          else:
              print(max(w for w, _ in weeks))
          PY
          )
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "NFL week: $WEEK"

      - name: Fetch NFL odds for current week
        run: python3 scripts/fetch-nfl-odds.py --week ${{ steps.week.outputs.week }}

      - name: Validate odds (custom script if present)
        run: |
          if [ -f scripts/validate-nfl-odds.py ]; then
            python3 scripts/validate-nfl-odds.py
          else
            echo "No custom validation script found, skipping."
          fi

      - name: Validate merged data (JSON/YAML + site validator)
        run: |
          python3 -m json.tool json/financials-data.json > /dev/null
          python3 -c "import yaml; yaml.safe_load(open('data/nfl-games.yml', encoding='utf-8'))"
          node scripts/validate-site.js

      - name: Apply NFL YAML (weekly)
        run: python3 scripts/apply-nfl-yml.py --week ${{ steps.week.outputs.week }} --replace-completed

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl-games.yml json/financials-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated NFL odds update for week ${{ steps.week.outputs.week }}"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
