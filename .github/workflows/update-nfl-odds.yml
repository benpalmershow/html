name: Update NFL Odds

on:
  schedule:
    # Daily refresh of current-week odds (06:00 UTC)
    - cron: '0 6 * * *'
    # Live odds during game days (all days, every 5 min during game hours)
    - cron: '*/5 0-5,12-23 * * *'
    # Post-game immediate polling: every 30 min for 4 hours after typical game end times
    # Covers all game days/end times so odds settle immediately on completion
    - cron: '*/30 0-6 * * *'
    - cron: '*/30 20-23 * * *'
    # Post-game cleanup (Fri/Mon/Tue UTC)
    - cron: '30 3-5 * * 5'
    - cron: '30 0-2 * * 1'
    - cron: '30 3-5 * * 1'
    - cron: '30 3-5 * * 2'
  repository_dispatch:
    types: [nfl-game-complete]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Share the financials-data group with fetch-all so the two workflows that
  # commit json/financials-data.json and json/fetch-status.json never overlap.
  # cancel-in-progress:false keeps the running job (never truncates a fetch);
  # GitHub keeps only the latest pending run in the group.
  group: financials-data
  cancel-in-progress: false

jobs:
  update-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Determine current NFL week (from game dates in YAML)
        id: week
        run: |
          WEEK=$(python3 scripts/determine_nfl_week.py)
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "NFL week: $WEEK"

      - name: Resolve game id from webhook payload
        id: game
        run: |
          echo "game_id=${{ github.event.client_payload.game_id }}" >> "$GITHUB_OUTPUT"

      - name: Fetch NFL odds for current week (full refresh)
        run: |
          if [ -n "${{ steps.game.outputs.game_id }}" ]; then
            python3 scripts/fetch-nfl-odds.py --game-id "${{ steps.game.outputs.game_id }}" --mode post-game --immediate-hours 4
          else
            python3 scripts/fetch-nfl-odds.py --week ${{ steps.week.outputs.week }}
          fi

      - name: Fetch live odds for games in gametime window
        run: python3 scripts/fetch-nfl-odds.py --week ${{ steps.week.outputs.week }} --mode live
        continue-on-error: true

      - name: Fetch post-game odds (immediate refresh after games end)
        run: python3 scripts/fetch-nfl-odds.py --week ${{ steps.week.outputs.week }} --mode post-game
        continue-on-error: true

      - name: Validate odds markets exist
        run: |
          if [ -f scripts/validate-nfl-odds.py ]; then
            python3 scripts/validate-nfl-odds.py --week ${{ steps.week.outputs.week }}
          else
            echo "No validation script found, skipping."
          fi

      - name: Apply NFL YAML to financials-data.json
        run: python3 scripts/apply-nfl-yml.py --week ${{ steps.week.outputs.week }}

      - name: Validate merged data (JSON/YAML + targeted NFL/site checks)
        run: |
          python3 -m json.tool json/financials-data.json > /dev/null
          python3 -c "import yaml; yaml.safe_load(open('data/nfl-games.yml', encoding='utf-8'))"
          python3 scripts/validate_nfl_data.py

      - name: Validate final site state
        run: node scripts/validate-site.js

      - name: Record fetch health
        if: always()
        run: |
          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) STATUS=ok ;;
            failure|cancelled) STATUS=failed ;;
            skipped) STATUS=skipped ;;
          esac
          python3 scripts/update_fetch_status.py \
            --workflow update-nfl-odds \
            --status "$STATUS" \
            --changes 0 \
            --notes "NFL odds refresh for week ${{ steps.week.outputs.week }}"

      - name: Commit changes
        uses: ./.github/actions/commit-changes
        with:
          message: "Automated NFL odds update for week ${{ steps.week.outputs.week }} [skip ci]"
          files: data/nfl-games.yml json/financials-data.json json/fetch-status.json