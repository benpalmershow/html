<!-- Unified Analytics Component with Consent Mode v2 -->
<script>
  // Initialize dataLayer and gtag function
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }

  // Consent Mode v2: Default to denied for ad_storage and analytics_storage
  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'analytics_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied'
  });

  gtag('js', new Date());

  // Main Google Analytics configuration with first-party mode enabled
  gtag('config', 'G-DWEVPGLJDP', {
    'anonymize_ip': true,
    'cookie_flags': 'SameSite=Lax;Secure',
    'first_party_collection': true
  });

  // Load gtag.js after page load with idle callback fallback
  function loadGtagScript() {
    const script = document.createElement('script');
    script.src = 'https://www.googletagmanager.com/gtag/js?id=G-DWEVPGLJDP';
    script.async = true;
    document.head.appendChild(script);
  }

  // Use requestIdleCallback if available, otherwise fallback to setTimeout
  if ('requestIdleCallback' in window) {
    requestIdleCallback(loadGtagScript);
  } else {
    setTimeout(loadGtagScript, 3000);
  }
</script>
