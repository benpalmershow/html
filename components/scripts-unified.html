
<!-- Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    const isLocalPreview = window.location.hostname === 'localhost'
      || window.location.hostname === '127.0.0.1'
      || window.location.protocol === 'file:';

    const cleanupLocalServiceWorker = async () => {
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(reg => reg.unregister()));
        const keys = await caches.keys();
        await Promise.all(keys.map(key => caches.delete(key)));
      } catch (error) {
        console.warn('Local service worker cleanup failed:', error);
      }
    };

    window.addEventListener('load', () => {
      if (isLocalPreview) {
        cleanupLocalServiceWorker();
        return;
      }

      navigator.serviceWorker.register('/sw.js').catch(error => {
        console.error('Service worker registration failed:', error);
      });
    });
  }
</script>

<!-- Analytics Event Tracking -->
<script>
  // Contact form submit tracking
  (function () {
    const btn = document.getElementById('contact-submit');
    if (!btn) return;

    btn.addEventListener('click', function () {
      if (typeof gtag === 'function') {
        gtag('event', 'contact_form_submit', {
          event_category: 'Contact',
          event_label: 'Form Submit',
          value: 1
        });
      }
    }, { passive: true });
  })();
</script>
