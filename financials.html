/* ========================================
   UTILITIES
   ======================================== */

.loading-state {
    text-align: center;
    padding: var(--spacing-lg);
    color: var(--text-muted);
    font-style: normal;
    min-height: 4rem;
    display: grid;
    place-items: center;
}

.error-state {
    text-align: center;
    padding: var(--spacing-lg);
    color: var(--color-error);
    background-color: var(--bg-secondary);
    border: 1px solid rgba(var(--border-color-rgb), 0.9);
    border-left: 3px solid var(--color-error);
    border-radius: var(--card-radius);
    margin: var(--spacing-md) 0;
}

/* Spacing Helpers */
.m-xs {
    margin: var(--spacing-xs);
}

.m-sm {
    margin: var(--spacing-sm);
}

.m-md {
    margin: var(--spacing-md);
}

.m-lg {
    margin: var(--spacing-lg);
}

.m-xl {
    margin: var(--spacing-xl);
}

.p-xs {
    padding: var(--spacing-xs);
}

.p-sm {
    padding: var(--spacing-sm);
}

.p-md {
    padding: var(--spacing-md);
}

.p-lg {
    padding: var(--spacing-lg);
}

.p-xl {
    padding: var(--spacing-xl);
}

/* ========================================
   COMPONENTS: CARDS
   ======================================== */

.card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--card-radius);
    padding: var(--spacing-md);
    box-shadow: var(--shadow-card);
    transition: transform var(--transition-base), box-shadow var(--transition-base), border-color var(--transition-base);
}

.card:hover,
.card:focus {
    transform: translateY(-2px);
    box-shadow: var(--shadow-card-hover);
    border-color: var(--accent-secondary);
}

.card.expanded {
    padding: 0;
}

.card a {
    text-decoration: none;
    color: var(--color-secondary);
    font-weight: 600;
    background: rgba(var(--color-secondary-rgb), 0.08);
    border: 1px solid var(--color-secondary);
    border-radius: var(--control-radius);
    padding: 0.18em 0.85em;
    margin: 0.15em 0.25em 0.15em 0;
    display: inline-block;
    transition: all 0.2s ease;
}

.card a:hover,
.card a:focus {
    background: var(--color-secondary);
    color: var(--color-white);
}

.media-card {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform var(--transition-base), box-shadow var(--transition-base);
}

.media-card:hover,
.media-card:focus {
    border-color: var(--accent-secondary);
    box-shadow: 0 4px 12px var(--shadow-color);
    transform: translateY(-2px);
}

.media-card.hidden {
    display: none;
}

.card-title {
    font-weight: 500;
    margin-bottom: var(--spacing-xs);
    color: var(--text-primary);
}

.featured-badge {
    background: var(--accent-secondary);
    color: var(--color-white);
    padding: var(--spacing-xs) var(--spacing-sm);
    border-radius: 2rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: var(--spacing-xs);
    margin-left: var(--spacing-sm);
}
  </style>

  <!-- Non-critical scripts loaded after idle to reduce TBT -->
  <script>
    (function() {
      const loadNonCriticalScripts = () => {
        const searchScript = document.createElement('script');
        searchScript.src = 'js/search.js?v=20260816';
        searchScript.defer = true;
        document.head.appendChild(searchScript);

        // World Cup - appears later in page
        const worldCupScript = document.createElement('script');
        worldCupScript.src = 'js/world-cup.js?v=20260816';
        worldCupScript.defer = true;
        document.head.appendChild(worldCupScript);

        // Countdown - non-critical
        const countdownScript = document.createElement('script');
        countdownScript.src = 'js/countdown.js?v=20260816';
        countdownScript.defer = true;
        document.head.appendChild(countdownScript);

        // Speed insights - non-critical
        const speedInsightsScript = document.createElement('script');
        speedInsightsScript.src = 'js/speed-insights.js?v=20260816';
        speedInsightsScript.defer = true;
        document.head.appendChild(speedInsightsScript);

        // Back to top - non-critical
        const backToTopScript = document.createElement('script');
        backToTopScript.src = 'js/back-to-top.js?v=20260816';
        backToTopScript.dataset.threshold = '300';
        backToTopScript.dataset.duration = '400';
        backToTopScript.dataset.label = 'Back to top';
        backToTopScript.dataset.position = 'right';
        backToTopScript.defer = true;
        document.head.appendChild(backToTopScript);

        // Vercel Insights - Production only
        if (typeof window !== 'undefined' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          const vercelScript = document.createElement('script');
          vercelScript.src = '/_vercel/insights/script.js';
          vercelScript.defer = true;
          document.head.appendChild(vercelScript);
        }
      };

      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadNonCriticalScripts, { timeout: 2000 });
      } else {
        window.addEventListener('load', () => setTimeout(loadNonCriticalScripts, 1000));
      }
    })();
  </script>
