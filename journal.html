  <script>
    (function () {
      'use strict';
      const feed = document.getElementById('feed');
      const emptyEl = document.getElementById('empty');
      const loadMore = document.getElementById('load-more');
      const mdCache = {};
      let allDays = [];
      let renderIndex = 0;
      const imageSizes = {
        'images/read.webp': [16, 16],
        'images/arrivals-of-ships.png': [1200, 800],
        'images/U.S. Department-small.png': [300, 220],
        'images/Zeekr.png': [1516, 1220]
      };
      function stripFrontmatter(md) {
        const match = String(md || '').match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
        return match ? match[2].trim() : String(md || '').trim();
      }
      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#96;');
      }
      function slugify(text) {
        return String(text)
          .toLowerCase()
          .replace(/[^\w\s-]/g, '')
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '');
      }
      function renderTableRows(rows) {
        if (rows.length < 2) return '';
        const headerCells = rows[0].split('|').slice(1, -1).map(c => c.trim());
        const bodyRows = rows.slice(2);
        let h = '<table><thead><tr>';
        headerCells.forEach(cell => {
          h += '<th>' + parseInline(cell, true) + '</th>';
        });
        h += '</tr></thead><tbody>';
        bodyRows.forEach(row => {
          const cells = row.split('|').slice(1, -1).map(c => c.trim());
          h += '<tr>';
          cells.forEach(cell => {
            h += '<td>' + parseInline(cell, true) + '</td>';
          });
          h += '</tr>';
        });
        h += '</tbody></table>';
        return h;
      }
      function renderTitle(title, link) {
        if (/<a\s/i.test(title)) return title;
        const esc = escapeHtml(title);
        if (link) {
          const ext = /^https?:\/\//i.test(link) ? ' target="_blank" rel="noopener noreferrer"' : '';
          return '<a href="' + escapeAttr(link) + '"' + ext + '>' + esc + '</a>';
        }
        return esc;
      }
      function parseInline(text, autolink) {
        const htmlBlocks = [];
        let out = String(text).replace(/<[^>]*>/g, match => {
          htmlBlocks.push(match);
          return '@@HTML' + (htmlBlocks.length - 1) + '@@';
        });
        out = escapeHtml(out)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/__([^_]+)__/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/_([^_]+)_/g, '<em>$1</em>')
          .replace(/~~([^~]+)~~/g, '<del>$1</del>');
        const links = [];
        out = out.replace(/\[([^\]]+)]\(([^\s)]+)\)/g, (_, label, url) => {
           const ext = /^https?:\/\//i.test(url) ? ' target="_blank" rel="noopener noreferrer"' : '';
           links.push('<a href="' + escapeAttr(url) + '"' + ext + '>' + parseInline(label, false) + '</a>');
           return '@@LINK' + (links.length - 1) + '@@';
         });
        if (autolink) {
          out = out.replace(/https?:\/\/[^\s<)]+/g, url => '<a href="' + escapeAttr(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(url) + '</a>');
        }
        out = out.replace(/@@LINK(\d+)@@/g, (_, i) => links[Number(i)] || '');
        out = out.replace(/@@HTML(\d+)@@/g, (_, i) => htmlBlocks[Number(i)] || '');
        return out;
      }
      function parseMarkdown(markdown) {
        const lines = stripFrontmatter(markdown).replace(/\r\n/g, '\n').split('\n');
        let html = '';
        let paragraph = [];
        let inCode = false;
        let inList = false;
        let inOrderedList = false;
        let inTable = false;
        let tableRows = [];
        const footnotes = {};
        function flushParagraph() {
          if (!paragraph.length) return;
          html += '<p>' + parseInline(paragraph.join(' '), true) + '</p>';
          paragraph = [];
        }
        function closeList() {
          if (inOrderedList) {
            html += '</ol>';
            inOrderedList = false;
          }
          if (inList) {
            html += '</ul>';
            inList = false;
          }
        }
        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) {
            flushParagraph();
            return;
          }
          const codeFence = line.match(/^```(\S*)/);
          if (codeFence) {
            flushParagraph();
            closeList();
            if (inCode) {
              html += '</code></pre>';
              inCode = false;
            } else {
              const lang = codeFence[1] ? ' class="language-' + codeFence[1] + '"' : '';
              html += '<pre><code' + lang + '>';
              inCode = true;
            }
            return;
          }
          if (inCode) {
            html += escapeHtml(line) + '\n';
            return;
          }
          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            closeList();
            const level = Math.min(heading[1].length, 3);
            const slug = slugify(heading[2]);
            html += '<h' + level + ' id="' + escapeAttr(slug) + '">' + parseInline(heading[2], true) + '</h' + level + '>';
            return;
          }
          const detailsTag = line.match(/^(<details>|<\/details>|<summary>.*<\/summary>)$/);
          if (detailsTag) {
            flushParagraph();
            closeList();
            if (inTable) {
              html += renderTableRows(tableRows);
              tableRows = [];
              inTable = false;
            }
            html += trimmed;
            return;
          }
          const quote = line.match(/^>\s?(.+)$/);
          if (quote) {
            flushParagraph();
            closeList();
            html += '<blockquote>' + parseInline(quote[1], true) + '</blockquote>';
            return;
          }
          const hr = line.match(/^(-{3,}|\*{3,}|_{3,})$/);
          if (hr) {
            flushParagraph();
            closeList();
            html += '<hr>';
            return;
          }
          const item = line.match(/^[-*]\s+(.+)$/);
          if (item) {
            flushParagraph();
            if (inOrderedList) {
              html += '</ol>';
              inOrderedList = false;
            }
            if (!inList) {
              html += '<ul>';
              inList = true;
            }
            const taskMatch = item[1].match(/^\[([ xX])\]\s+(.+)$/);
            if (taskMatch) {
              const checked = taskMatch[1] !== ' ' ? ' checked' : '';
              html += '<li><input type="checkbox" disabled' + checked + '> ' + parseInline(taskMatch[2], true) + '</li>';
            } else {
              html += '<li>' + parseInline(item[1], true) + '</li>';
            }
            return;
          }
          const orderedItem = line.match(/^(\d+)\.\s+(.+)$/);
          if (orderedItem) {
            if (inTable) {
              html += renderTableRows(tableRows);
              tableRows = [];
              inTable = false;
            }
            flushParagraph();
            if (inList) {
              html += '</ul>';
              inList = false;
            }
            if (!inOrderedList) {
              html += '<ol>';
              inOrderedList = true;
            }
            html += '<li>' + parseInline(orderedItem[2], true) + '</li>';
            return;
          }
          const tableRow = line.match(/^\|.+\|$/);
          if (tableRow) {
            flushParagraph();
            if (!inTable) {
              inTable = true;
            }
            tableRows.push(trimmed);
            return;
          }
          if (inTable) {
            html += renderTableRows(tableRows);
            tableRows = [];
            inTable = false;
          }
          const fnDef = line.match(/^\[\^(\d+)\]:\s+(.+)$/);
          if (fnDef) {
            footnotes[fnDef[1]] = fnDef[2];
            return;
          }
          paragraph.push(trimmed);
        });
        flushParagraph();
        closeList();
        if (inTable) {
          html += renderTableRows(tableRows);
          tableRows = [];
          inTable = false;
        }
        if (inCode) html += '</code></pre>';
        let result = html;
        const fnKeys = Object.keys(footnotes);
        if (fnKeys.length) {
          result = result.replace(/\[\^(\d+)\]/g, (_, num) => {
            return '<sup><a href="#fn-' + num + '" id="fnref-' + num + '">' + num + '</a></sup>';
          });
          result += '<section class="footnotes"><ol>';
          fnKeys.forEach(num => {
            result += '<li id="fn-' + num + '">' + parseInline(footnotes[num], true) + ' <a href="#fnref-' + num + '">↩</a></li>';
          });
          result += '</ol></section>';
        }
        return result;
      }
      function getAttr(tag, name) {
        const match = tag.match(new RegExp('\\s' + name + '\\s*=\\s*(?:"([^"]*)"|\'([^\']*)\')', 'i'));
        return (match && (match[1] || match[2] || '')).trim();
      }
      function imageSize(src) {
        return imageSizes[src] || [1200, 675];
      }
      function normalizeImages(html) {
        return String(html || '').replace(/<img\b[^>]*>/gi, tag => {
          const src = getAttr(tag, 'src');
          if (!src) return '';
          const alt = getAttr(tag, 'alt') || '';
          const size = imageSize(src);
          const attrs = 'src="' + escapeAttr(src) + '" alt="' + escapeAttr(alt) + '" width="' + size[0] + '" height="' + size[1] + '" loading="lazy" decoding="async"';
          const external = /^https?:\/\//i.test(src);
          const img = '<img ' + attrs + (external ? ' referrerpolicy="no-referrer" crossorigin="anonymous"' : '') + '>';
          return external ? '<a class="media-link" href="' + escapeAttr(src) + '" target="_blank" rel="noopener noreferrer" aria-label="Open image">' + img + '</a>' : img;
        });
      }
      function normalizeIframes(html) {
        return String(html || '').replace(/<iframe\b[^>]*>/gi, tag => {
          const src = getAttr(tag, 'src');
          if (!src) return '';
          const title = getAttr(tag, 'title') || 'Embedded video';
          return '<div class="video-placeholder" role="button" tabindex="0" data-video-src="' + escapeAttr(src) + '" aria-label="Play ' + escapeAttr(title) + '">Play video</div>';
        });
      }
      function normalizeContent(html) {
        return normalizeIframes(normalizeImages(html));
      }
      function buildEntry(entry) {
        const hasFile = !!entry.file;
        const hasContent = !!entry.content;
        const hasLink = !!entry.link;
        const hasToggle = hasFile || (hasContent && entry.collapsed);
        const div = document.createElement('div');
        div.className = 'entry';
        if (entry.category) {
          div.dataset.category = entry.category;
        }
        if (Array.isArray(entry.tags) && entry.tags.length > 0) {
          div.dataset.tags = entry.tags.join(',');
        }
        if (entry.type) {
          div.dataset.type = entry.type;
        }
        const headEl = document.createElement('div');
        headEl.className = 'entry-head' + (hasToggle ? ' has-toggle' : '');
        const titleEl = document.createElement('span');
        titleEl.className = 'entry-title';
        titleEl.innerHTML = renderTitle(entry.title, hasLink ? entry.link : null);
        const metaEl = document.createElement('span');
        metaEl.className = 'entry-meta';
        if (entry.time) {
          const time = document.createElement('span');
          time.className = 'entry-time';
          time.textContent = entry.time;
          metaEl.appendChild(time);
        }
        headEl.appendChild(titleEl);
        headEl.appendChild(metaEl);
        let accordionEl = null;
        if (hasToggle) {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('class', 'chevron');
          svg.setAttribute('viewBox', '0 0 14 14');
          svg.setAttribute('fill', 'none');
          svg.setAttribute('stroke', 'currentColor');
          svg.setAttribute('stroke-width', '1.5');
          svg.setAttribute('stroke-linecap', 'round');
          svg.setAttribute('stroke-linejoin', 'round');
          svg.setAttribute('aria-hidden', 'true');
          svg.innerHTML = '<polyline points="4,2 9,7 4,12"/>';
          headEl.insertBefore(svg, titleEl);
          accordionEl = document.createElement('div');
          accordionEl.className = 'accordion';
          accordionEl.hidden = true;
          accordionEl.setAttribute('role', 'region');
          const inner = document.createElement('div');
          inner.className = 'accordion-inner';
          accordionEl.appendChild(inner);
          let loaded = false;
          headEl.setAttribute('role', 'button');
          headEl.setAttribute('tabindex', '0');
          headEl.setAttribute('aria-expanded', 'false');
          function toggle() {
            const open = headEl.getAttribute('aria-expanded') === 'true';
            headEl.setAttribute('aria-expanded', String(!open));
            accordionEl.hidden = open;
            if (!open && !loaded) {
              loaded = true;
              if (hasFile) {
                inner.innerHTML = '<div class="accordion-loading"><div class="loading-spinner"></div><span>Loading content...</span></div>';
                if (mdCache[entry.file]) {
                  inner.innerHTML = normalizeContent(parseMarkdown(mdCache[entry.file]));
                  return;
                }
                fetch(entry.file)
                  .then(response => response.ok ? response.text() : Promise.reject(response.status))
                  .then(text => {
                    mdCache[entry.file] = text;
                    inner.innerHTML = normalizeContent(parseMarkdown(text));
                  })
                  .catch(() => {
                    inner.innerHTML = '<span class="loading-error">Could not load file.</span>';
                  });
               } else if (hasContent) {
                 inner.innerHTML = normalizeContent(parseInline(entry.content, true));
               }
            }
          }
          headEl.addEventListener('click', toggle);
          headEl.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              toggle();
            }
          });
        }
        div.appendChild(headEl);

        if (Array.isArray(entry.tags) && entry.tags.length > 0) {
          const tagsEl = document.createElement('div');
          tagsEl.className = 'entry-tags';
          const tagIcons = {
            'financials': '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tag-icon" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>',
            'media': '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tag-icon" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>',
            'video': '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tag-icon" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>',
            'external': '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tag-icon" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>'
          };
          if (Array.isArray(entry.tags)) {
            entry.tags.forEach(tag => {
              const chip = document.createElement('button');
              chip.type = 'button';
              chip.className = 'entry-tag-chip' + (tagIcons[tag] ? ' tag-' + tag : '');
              chip.dataset.tag = tag;
              const iconHtml = tagIcons[tag] || '';
              chip.innerHTML = iconHtml + '#' + escapeHtml(tag);
              chip.setAttribute('aria-label', 'Filter by tag #' + tag);
              tagsEl.appendChild(chip);
            });
          }
          div.appendChild(tagsEl);
        }

        if (hasContent && !hasToggle) {
          const contentEl = document.createElement('div');
          contentEl.className = 'entry-content';
          contentEl.innerHTML = normalizeContent(parseInline(entry.content, true));
          div.appendChild(contentEl);
        }
        if (accordionEl) div.appendChild(accordionEl);
        return div;
      }
      function buildDay(day) {
        const section = document.createElement('section');
        section.className = 'day';
        section.dataset.date = day.date;
        section.id = day.date;
        const header = document.createElement('div');
        header.className = 'day-header';
        header.textContent = day.date;
        section.appendChild(header);
        (day.entries || []).forEach(entry => section.appendChild(buildEntry(entry)));
        return section;
      }
      function renderMore() {
        const next = allDays.slice(renderIndex, renderIndex + 30);
        const fragment = document.createDocumentFragment();
        next.forEach(day => fragment.appendChild(buildDay(day)));
        feed.appendChild(fragment);
        renderIndex += next.length;
        loadMore.classList.toggle('is-visible', renderIndex < allDays.length);
        emptyEl.style.display = allDays.length === 0 ? 'block' : 'none';
        if (window.location.hash) scrollToHash();
      }
      function scrollToHash() {
        const id = window.location.hash.slice(1);
        const target = document.getElementById(id) || document.querySelector('[data-date="' + id.replace(/"/g, '\\"') + '"]');
        if (target) {
          setTimeout(() => target.scrollIntoView({ behavior: 'smooth' }), 50);
        }
      }
      function activateVideo(target) {
        if (!target || target.dataset.loaded === 'true') return;
        target.dataset.loaded = 'true';
        const iframe = document.createElement('iframe');
        iframe.src = target.dataset.videoSrc;
        iframe.title = 'Embedded video';
        iframe.loading = 'lazy';
        iframe.referrerPolicy = 'strict-origin-when-cross-origin';
        iframe.allow = 'accelerometer; autoplay; clipboard-write encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        target.replaceWith(iframe);
      }
      feed.addEventListener('click', event => {
        activateVideo(event.target.closest('[data-video-src]'));
      });
      feed.addEventListener('keydown', event => {
        const target = event.target.closest('[data-video-src]');
        if (!target) return;
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activateVideo(target);
        }
      });
      loadMore.addEventListener('click', renderMore);
      fetch('json/journal.json')
        .then(response => response.ok ? response.json() : Promise.reject(response.status))
        .then(data => {
          allDays = Array.isArray(data) ? data : [];
          const loadingEl = document.getElementById('feed-loading');
          if (loadingEl) loadingEl.style.display = 'none';
          
          const hasHash = !!window.location.hash;
          if (hasHash) {
            renderIndex = 0;
            renderMore();
            scrollToHash();
          } else {
            renderMore();
          }
          
          // Initialize filters after content is loaded, similar to media.js pattern
          if (typeof window.filterJournalEntries === 'function') {
            window.filterJournalEntries();
          }
        })
        .catch(() => {
          const loadingEl = document.getElementById('feed-loading');
          if (loadingEl) loadingEl.style.display = 'none';
          feed.innerHTML = '<p style="color:var(--text-muted);font-size:.9rem">Failed to load journal.json</p>';
          emptyEl.style.display = 'none';
          loadMore.style.display = 'none';
        });
    })();
