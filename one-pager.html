   <script>
    (function () {
      try {
        var saved = localStorage.getItem('darkMode');
        var dark = saved === null
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : saved === '1';
        var root = document.documentElement;
        root.classList.toggle('dark-mode', dark);
        root.classList.add('theme-init');
        var scheme = saved === null ? 'light dark' : (dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = scheme;
      } catch (e) {}
    })();
  </script>

  <script>
    (function () {
      const toggle = document.getElementById('darkModeToggle');
      function updateToggle() {
        if (!toggle) return;
        const isDark = document.documentElement.classList.contains('dark-mode');
        toggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
        toggle.setAttribute('title', isDark ? 'Switch to light mode' : 'Switch to dark mode');
        toggle.setAttribute('aria-pressed', isDark ? 'true' : 'false');
      }
      if (toggle) {
        toggle.addEventListener('click', () => {
          document.documentElement.classList.toggle('dark-mode');
          var isDark = document.documentElement.classList.contains('dark-mode');
          try { localStorage.setItem('darkMode', isDark ? '1' : '0'); } catch (e) {}
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = isDark ? 'dark' : 'light';
          updateToggle();
        });
      }
      updateToggle();
    })();
  </script>

   <!-- Load Lucide icons on-demand after page load -->
  <script>
    (function () {
      const loadLucide = () => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/lucide@0.400.0/dist/umd/lucide.js';
        script.defer = true;
        script.onload = () => window.lucide?.createIcons();
        document.head.appendChild(script);
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadLucide, { timeout: 3000 });
      } else {
        setTimeout(loadLucide, 100);
      }
    })();
  </script>
